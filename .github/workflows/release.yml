name: Release to PowerShell Gallery

on:
  workflow_dispatch:
    inputs:
      module:
        description: 'Module to publish (all publishes Core first, then the rest)'
        required: true
        type: choice
        default: 'all'
        options:
          - all
          - SophosFirewall.Core
          - SophosFirewall.HostsAndServices
          - SophosFirewall.Web
          - SophosFirewall.Firewall
          - SophosFirewall.Network
          - SophosFirewall.Authentication
          - SophosFirewall.Routing
          - SophosFirewall.VPN
          - SophosFirewall.IntrusionPrevention
          - SophosFirewall.ActiveThreatResponse
          - SophosFirewall.Applications
          - SophosFirewall.SystemServices
          - SophosFirewall.Administration
          - SophosFirewall.Profiles
          - SophosFirewall.WebServer
          - SophosFirewall.Certificates
          - SophosFirewall.Email
          - SophosFirewall.Diagnostics
          - SophosFirewall.ZeroDayProtection
          - SophosFirewall.SophosCentral
      dryRun:
        description: 'Dry run (do not actually publish)'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish Modules
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Verify API key secret is present
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |
          if ([string]::IsNullOrEmpty($env:NUGET_API_KEY)) {
            Write-Error "Secret 'PSGALLERY_API_KEY' is not set. Add it in the repository settings before running this workflow."
            exit 1
          }
          Write-Host "OK: API key secret is present"

      - name: Determine publish order
        id: plan
        shell: pwsh
        run: |
          $selected = '${{ inputs.module }}'

          if ($selected -eq 'all') {
            $order = @(
              'SophosFirewall.Core',
              'SophosFirewall.HostsAndServices',
              'SophosFirewall.Web',
              'SophosFirewall.Firewall',
              'SophosFirewall.Network',
              'SophosFirewall.Authentication',
              'SophosFirewall.Routing',
              'SophosFirewall.VPN',
              'SophosFirewall.IntrusionPrevention',
              'SophosFirewall.ActiveThreatResponse',
              'SophosFirewall.Applications',
              'SophosFirewall.SystemServices',
              'SophosFirewall.Administration',
              'SophosFirewall.Profiles',
              'SophosFirewall.WebServer',
              'SophosFirewall.Certificates',
              'SophosFirewall.Email',
              'SophosFirewall.Diagnostics',
              'SophosFirewall.ZeroDayProtection',
              'SophosFirewall.SophosCentral'
            )
          } else {
            $order = @($selected)
          }

          Write-Host "Publish order: $($order -join ', ')"
          $json = $order | ConvertTo-Json -Compress
          if ($order.Count -eq 1) {
            # ConvertTo-Json on a 1-element array without -AsArray (PS 5.1) yields a scalar; force array form
            $json = "[$json]"
          }
          "modules=$json" >> $env:GITHUB_OUTPUT

      - name: Publish modules
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
          DRY_RUN: ${{ inputs.dryRun }}
        run: |
          # Not setting $ErrorActionPreference = 'Stop' globally: each risky cmdlet below
          # already carries its own -ErrorAction Stop inside a try/catch. A global 'Stop'
          # would also turn the diagnostic Write-Error calls into terminating errors and
          # abort the whole loop after the first skipped module.
          $modulesRoot = Join-Path $PWD 'Modules'
          $env:PSModulePath = "$modulesRoot$([System.IO.Path]::PathSeparator)$env:PSModulePath"
          Write-Host "PSModulePath includes: $modulesRoot"

          $isDryRun = [System.Convert]::ToBoolean($env:DRY_RUN)
          Write-Host "Dry run: $isDryRun"

          $moduleNames = '${{ steps.plan.outputs.modules }}' | ConvertFrom-Json

          # Pre-flight: can every dependency actually be resolved the way Publish-Module resolves
          # them - against the Gallery, not against this checkout?
          #
          # Step 1 below validates the manifest with the repository on PSModulePath, so a
          # dependency sitting right next to the module in Modules/ always resolves and the dry
          # run comes back green. The real publish asks the Gallery instead, which is a different
          # question entirely, and that is how a clean dry run was followed by a failed release.
          # Ask the Gallery here, in both dry and real runs, before anything is uploaded.
          Write-Host "`n=== Dependency pre-flight ===" -ForegroundColor Cyan
          $planPosition = @{}
          for ($i = 0; $i -lt $moduleNames.Count; $i++) { $planPosition[$moduleNames[$i]] = $i }
          $preflightProblems = @()

          for ($i = 0; $i -lt $moduleNames.Count; $i++) {
            $name = $moduleNames[$i]
            $mp = Join-Path $modulesRoot "$name\$name.psd1"
            if (-not (Test-Path $mp)) { continue }
            $data = Import-PowerShellDataFile -Path $mp
            foreach ($dep in @($data.RequiredModules)) {
              if (-not $dep) { continue }
              $depName = if ($dep -is [string]) { $dep } else { $dep.ModuleName }
              $depVer = if ($dep -is [string]) { $null } else { $dep.ModuleVersion }
              $label = "$name requires $depName$(if ($depVer) { " $depVer" })"

              $inGallery = $false
              try {
                $args = @{ Name = $depName; Repository = 'PSGallery'; ErrorAction = 'SilentlyContinue' }
                if ($depVer) { $args['MinimumVersion'] = $depVer }
                if (Find-Module @args) { $inGallery = $true }
              }
              catch { }

              if ($inGallery) {
                Write-Host "OK: $label - resolvable in the Gallery"
              }
              elseif ($planPosition.ContainsKey($depName) -and $planPosition[$depName] -lt $i) {
                Write-Host "OK: $label - not in the Gallery yet, published earlier in this run" -ForegroundColor Yellow
              }
              elseif ($planPosition.ContainsKey($depName)) {
                $preflightProblems += "$label - published LATER in this run. The publish order is wrong; move $depName ahead of $name."
              }
              else {
                $preflightProblems += "$label - not in the Gallery and not part of this run. Publish $depName first, or select 'all'."
              }
            }
          }

          if ($preflightProblems) {
            foreach ($problem in $preflightProblems) { Write-Error $problem }
            Write-Error "Dependency pre-flight failed. Nothing was published."
            exit 1
          }
          Write-Host "Dependency pre-flight passed." -ForegroundColor Green

          $results = @()

          foreach ($moduleName in $moduleNames) {
            Write-Host "`n=== $moduleName ===" -ForegroundColor Cyan

            $result = [PSCustomObject]@{
              Module    = $moduleName
              Version   = $null
              Status    = 'Skipped'
              Detail    = ''
            }

            $manifestPath = Join-Path $modulesRoot "$moduleName\$moduleName.psd1"

            if (-not (Test-Path -Path $manifestPath)) {
              $result.Detail = "Manifest not found at $manifestPath"
              Write-Error $result.Detail
              $results += $result
              continue
            }

            # 1. Manifest must be valid (RequiredModules resolved via PSModulePath above)
            try {
              $manifest = Test-ModuleManifest -Path $manifestPath -ErrorAction Stop
              $result.Version = $manifest.Version.ToString()
              Write-Host "OK: Manifest valid: $moduleName v$($result.Version)"
            }
            catch {
              $result.Detail = "Test-ModuleManifest failed: $($_.Exception.Message)"
              Write-Error $result.Detail
              $results += $result
              continue
            }

            # 2. Target version must not already exist in the Gallery
            $feedUri = "https://www.powershellgallery.com/api/v2/FindPackagesById()?id='$moduleName'"
            try {
              $existing = Invoke-RestMethod -Uri $feedUri -ErrorAction Stop
              $existingVersions = @($existing | ForEach-Object { $_.properties.Version })
            }
            catch {
              $result.Detail = "Could not query PowerShell Gallery for '$moduleName': $($_.Exception.Message)"
              Write-Error $result.Detail
              $results += $result
              continue
            }

            Write-Host "Versions already in Gallery: $(if ($existingVersions) { $existingVersions -join ', ' } else { '(none)' })"

            # Already at the target version is nothing to do, not a failure. Treating it as one
            # made a resumed run impossible: after a partial release the modules that did go out
            # would fail the job for ever after, and the run could never be completed.
            if ($existingVersions -contains $result.Version) {
              $result.Status = 'AlreadyPublished'
              $result.Detail = "Version $($result.Version) is already in the Gallery - nothing to do."
              Write-Host $result.Detail -ForegroundColor Yellow
              $results += $result
              continue
            }

            # 3. Module must import and export at least one function
            try {
              Import-Module -Name $manifestPath -Force -ErrorAction Stop
              $exported = @(Get-Command -Module $moduleName -CommandType Function -ErrorAction Stop)
              if ($exported.Count -eq 0) {
                throw "Module imported but exports no functions."
              }
              Write-Host "OK: Imports cleanly, exports $($exported.Count) function(s)"
              Remove-Module -Name $moduleName -Force -ErrorAction SilentlyContinue
            }
            catch {
              $result.Detail = "Import check failed: $($_.Exception.Message)"
              Write-Error $result.Detail
              $results += $result
              continue
            }

            # 4. Publish (or simulate)
            $moduleDir = Split-Path -Path $manifestPath -Parent

            if ($isDryRun) {
              # NOTE: Publish-Module -WhatIf does NOT reliably suppress the underlying
              # 'nuget.exe push' call in PowerShellGet (verified: it attempted a real push
              # and only failed because of an invalid key). Calling it here with a real API
              # key would risk a genuine publish during a dry run, so the dry run never calls
              # Publish-Module at all - it only reports what a real run would do.
              $result.Status = 'DryRun'
              $result.Detail = "Would publish $moduleName v$($result.Version) to PowerShell Gallery (PSGallery)"
              Write-Host "DRY RUN: $($result.Detail)" -ForegroundColor Yellow
            }
            else {
              try {
                Publish-Module -Path $moduleDir -NuGetApiKey $env:NUGET_API_KEY -Force -ErrorAction Stop
                $result.Status = 'Published'
                $result.Detail = "Published $moduleName v$($result.Version) to PowerShell Gallery"
                Write-Host "OK: $($result.Detail)" -ForegroundColor Green

                # A package is not resolvable the moment it is uploaded - the Gallery indexes it
                # a few minutes later. Publish-Module resolves RequiredModules through that same
                # index, so publishing a dependent too early fails with "cannot resolve the module
                # dependency", even though the dependency went out seconds ago. Wait here rather
                # than let the next module inherit the race.
                $deadline = (Get-Date).AddMinutes(15)
                $indexed = $false
                while (-not $indexed -and (Get-Date) -lt $deadline) {
                  Start-Sleep -Seconds 20
                  $found = Find-Module -Name $moduleName -RequiredVersion $result.Version `
                    -Repository PSGallery -ErrorAction SilentlyContinue
                  if ($found) { $indexed = $true }
                  else { Write-Host "  waiting for the Gallery to index $moduleName v$($result.Version)..." }
                }
                if ($indexed) {
                  Write-Host "OK: $moduleName v$($result.Version) is resolvable in the Gallery" -ForegroundColor Green
                }
                else {
                  $result.Status = 'PublishedNotIndexed'
                  $result.Detail = "Published, but not resolvable in the Gallery within 15 minutes. Modules depending on it will fail until it appears."
                  Write-Warning $result.Detail
                }
              }
              catch {
                $result.Detail = "Publish-Module failed: $($_.Exception.Message)"
                Write-Error $result.Detail
              }
            }

            $results += $result
          }

          $results | Format-Table -AutoSize | Out-String | Write-Host

          $summary = "# Release Summary`n`n"
          $summary += "| Module | Version | Status | Detail |`n"
          $summary += "|---|---|---|---|`n"
          foreach ($r in $results) {
            $version = if ($r.Version) { $r.Version } else { 'n/a' }
            $detail = $r.Detail -replace '\|', '\|'
            $summary += "| $($r.Module) | $version | $($r.Status) | $detail |`n"
          }
          $summary >> $env:GITHUB_STEP_SUMMARY

          $failed = @($results | Where-Object { $_.Status -notin @('Published', 'AlreadyPublished', 'DryRun') })
          if ($failed) {
            Write-Error "Could not publish: $(($failed | ForEach-Object { $_.Module }) -join ', '). See table above."
            exit 1
          }


