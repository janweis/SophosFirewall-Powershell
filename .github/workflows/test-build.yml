name: Test & Build

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'Modules/**'
      - 'Tests/**'
      - '.github/workflows/**'
      - '*.ps1'
      - '*.md'
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run tests daily at 2 AM UTC
    - cron: '0 2 * * *'

permissions:
  contents: read

jobs:
  pester-test:
    name: Pester Tests (PowerShell ${{ matrix.name }})
    runs-on: windows-latest
    
    strategy:
      matrix:
        include:
          - shell: 'powershell'
            name: '5.1'
          - shell: 'pwsh'
            name: '7.x'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      # Der Schluessel 'shell' akzeptiert den matrix-Kontext nicht - GitHub lehnt
      # "Unrecognized named-value: 'matrix'" ab. Deshalb ein Schritt je Shell, beide
      # rufen dasselbe Skript auf, damit die Logik nur einmal existiert.
      - name: Run Pester Tests (Windows PowerShell 5.1)
        if: matrix.name == '5.1'
        shell: powershell
        run: .\.github\scripts\Invoke-CiPester.ps1

      - name: Run Pester Tests (PowerShell 7.x)
        if: matrix.name == '7.x'
        shell: pwsh
        run: .\.github\scripts\Invoke-CiPester.ps1
      
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pester-results-ps${{ matrix.name }}
          path: TestResults.xml

  code-analysis:
    name: Code Analysis
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -SkipPublisherCheck -Scope CurrentUser
          Import-Module PSScriptAnalyzer -Force
      
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          try {
            # Run full analysis and show all results
            $allResults = Invoke-ScriptAnalyzer -Path 'Modules' -Recurse -ExcludeRule PSUseApprovedVerbs -ErrorAction Stop
            
            # Separate errors from warnings
            $errors = $allResults | Where-Object { $_.Severity -eq 'Error' }
            $warnings = $allResults | Where-Object { $_.Severity -eq 'Warning' }
            
            # Display all findings
            if ($allResults) {
              Write-Host "`n=== PSScriptAnalyzer Results ===" -ForegroundColor Cyan
              $allResults | Format-Table -AutoSize
              Write-Host "`nSummary: $($errors.Count) Error(s), $($warnings.Count) Warning(s)" -ForegroundColor Cyan
            }
            
            # Only fail on errors (warnings are informational)
            if ($errors) {
              Write-Error "PSScriptAnalyzer found $($errors.Count) error(s)"
              exit 1
            } else {
              Write-Host "OK: No critical code analysis issues found" -ForegroundColor Green
              if ($warnings) {
                Write-Host "  $($warnings.Count) warning(s) detected (non-blocking)" -ForegroundColor Yellow
              }
            }
          }
          catch {
            Write-Error "PSScriptAnalyzer execution failed: $_"
            exit 1
          }
      
      - name: Validate Module Manifests
        shell: pwsh
        run: |
          # Add Modules directory to PSModulePath so dependencies can be resolved
          $modulesPath = Join-Path $PWD 'Modules'
          $env:PSModulePath = "$modulesPath$([System.IO.Path]::PathSeparator)$env:PSModulePath"
          
          Write-Host "Module search paths:" -ForegroundColor Cyan
          $env:PSModulePath -split [System.IO.Path]::PathSeparator | ForEach-Object { Write-Host "  - $_" }
          
          $manifests = Get-ChildItem -Path 'Modules' -Recurse -Filter '*.psd1'
          $failCount = 0
          
          foreach ($manifest in $manifests) {
            try {
              $testResult = Test-ModuleManifest -Path $manifest.FullName -ErrorAction Stop
              Write-Host "OK: Valid: $($manifest.Name) (v$($testResult.Version))" -ForegroundColor Green
            }
            catch {
              Write-Error "FAIL: Invalid: $($manifest.Name) - $_"
              $failCount++
            }
          }
          
          if ($failCount -gt 0) {
            exit 1
          }

  security-scan:
    name: Security Scan
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Scan for Hardcoded Credentials
        shell: pwsh
        run: |
          # A literal-value assignment ("keyword = 'value'") is a finding. A value
          # that is itself a variable or expression ($var, or a quoted string that
          # starts with $ for interpolation, e.g. "$(...)") is not - the negative
          # lookahead (?!\$) right after the opening quote excludes those.
          $patterns = @(
            '\bapi[ _-]?key\b\s*=\s*["''](?!\$)[^"''\r\n]+["'']',
            '\bpassword\b\s*=\s*["''](?!\$)[^"''\r\n]+["'']',
            '\bsecret\b\s*=\s*["''](?!\$)[^"''\r\n]+["'']',
            '\btoken\b\s*=\s*["''](?!\$)[^"''\r\n]+["'']',
            '-----BEGIN\s+(?:RSA|DSA|EC|OPENSSH|ENCRYPTED)?\s*PRIVATE KEY-----'
          )

          $files = @()
          $files += Get-ChildItem -Path 'Modules' -Recurse -Include '*.ps1', '*.psm1' -ErrorAction SilentlyContinue
          $files += Get-ChildItem -Path 'Tests' -Recurse -Include '*.ps1' -ErrorAction SilentlyContinue
          $files += Get-ChildItem -Path '.' -Filter '*.md' -File -ErrorAction SilentlyContinue

          $findings = @()
          if ($files) {
            foreach ($pattern in $patterns) {
              $findings += Select-String -Path $files.FullName -Pattern $pattern -AllMatches -ErrorAction SilentlyContinue
            }
          }

          if ($findings) {
            foreach ($finding in $findings) {
              Write-Warning "Potential hardcoded credential found in: $($finding.Path):$($finding.LineNumber): $($finding.Line.Trim())"
            }
            Write-Error "Security issues found: $($findings.Count) potential credential(s)"
            exit 1
          } else {
            Write-Host "OK: No hardcoded credentials detected"
          }

  build-module:
    name: Build Modules
    needs: [pester-test, code-analysis, security-scan]
    runs-on: windows-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Build Modules
        shell: pwsh
        run: |
          # Define build output directory
          $buildPath = Join-Path $PWD '_Build'
          
          New-Item -ItemType Directory -Path $buildPath -Force | Out-Null
          
          # Copy all SophosFirewall modules to build directory
          $modules = Get-ChildItem -Path 'Modules' -Recurse -Filter '*.psd1'
          
          foreach ($module in $modules) {
            $moduleDir = $module.Directory.FullName
            $moduleName = $module.BaseName
            $destDir = Join-Path $buildPath $moduleName
            
            Copy-Item -Path $moduleDir -Destination $destDir -Recurse -Force
            Write-Host "Built: $moduleName"
          }
          
          Write-Host "OK: Build complete: $buildPath"
      
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sophos-firewall-modules
          path: _Build/
          retention-days: 30

  documentation:
    name: Documentation Check
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Check Module Documentation
        shell: pwsh
        run: |
          $missingDocs = @()
          $modules = Get-ChildItem -Path 'Modules' -Directory | 
            Where-Object { $_.Name -like 'SophosFirewall.*' }
          
          foreach ($module in $modules) {
            $hasReadme = Test-Path -Path (Join-Path $module.FullName 'README.md')
            
            if (-not $hasReadme) {
              $missingDocs += $module.Name
            }
          }
          
          if ($missingDocs) {
            Write-Warning "Missing documentation for: $($missingDocs -join ', ')"
            # Don't fail build, just warn for now
            # exit 1
          } else {
            Write-Host "OK: All modules have documentation"
          }

  summary:
    name: Test Summary
    if: always()
    needs: [pester-test, code-analysis, security-scan]
    runs-on: windows-latest
    
    steps:
      - name: Create Job Summary
        run: |
          echo "# Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Pester Tests**: ${{ needs.pester-test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Code Analysis**: ${{ needs.code-analysis.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Security Scan**: ${{ needs.security-scan.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "See [Action Logs]({{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details." >> $GITHUB_STEP_SUMMARY
